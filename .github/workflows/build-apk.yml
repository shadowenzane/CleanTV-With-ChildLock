name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using SDK at $SDK"
          ls "$SDK" || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.suppressUnsupportedCompileSdk=35

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7
